[project]
name = "promoai"
version = "0.1.0"
description = "Leverages LLMs for generating process models."
authors = [
    {name = "Adrian Sondermann", email = "extern.Adrian.Sondermann@itzbund.de"}
]
license = {text = "GPL-3.0-or-later"}
readme = "README.md"
requires-python = ">=3.10,<4.0"

dependencies = [
    "anthropic (>=0.49.0,<0.50.0)",
    "google-generativeai (>=0.8.4,<0.9.0)",
    "pm4py (==2.7.14.2)",
    "pydantic (>=2.11.1,<3.0.0)",
    "pydantic-settings (>=2.8.1,<3.0.0)",
    "python-dotenv (>=1.1.0,<1.2.0)",
    "requests (>=2.32.3,<3.0.0)",
    "rustxes (>=0.2.9,<0.3.0)",
    "setuptools (>=78.1.0,<79.0.0)",
    "streamlit (>=1.44.0,<2.0.0)",
]

[tool.poetry.group.dev.dependencies]
mypy = "^1.15.0"
pre-commit = "^4.2.0"
ruff = "^0.11.2"
types-requests = "^2.32"


[tool.ruff]
# Assume Python 3.10
target-version = "py310"
# Exclude a variety of commonly ignored directories.
exclude = [
    ".git",
    ".ipynb_checkpoints",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    ".vscode",
    # "notebooks"
]
line-length = 80  # formatter wraps at length 100
indent-width = 4

[tool.ruff.lint]
select = [
    "E",  # Pycodestyle Errors
    "F",  # Pyflakes
    "I",  # isort
    "Q",  # flake8-quotes
    "W",  # Pycodestyle Warnings
]
ignore = [
    "F541",  # ignore "f-string without any placeholders"
    "Q000"  # ignore "Single quotes found but double quotes preferred"
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.extend-per-file-ignores]
"./promoai/prompting/*" = [
    "E501",  # ignore line-too-long warnings in promoai/prompting/
    "W291"  # ignore trailing whitespaces in promoai/prompting/
]
# ignore imported_but_unused warnings in __init__.py
"__init__.py" = ["F401"]
# ignore line-too-long warnings in notebooks
"./notebooks/*" = ["E501"]

[tool.ruff.lint.pycodestyle]
# E501 line-too-long reports lines that exceed the length of 120
max-line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"


[tool.mypy]
files = ["promoai"]
python_version = "3.10"
plugins = ['pydantic.mypy']


disallow_untyped_defs = true  # Require type hints for all function definitions
ignore_missing_imports = true
show_error_codes = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
